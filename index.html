<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>벽돌 깨기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(circle at 50% 0%, #1e2a4a, #0b1020 70%);
    color: #e8ecf8;
    font-family: "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 16px; touch-action: none; user-select: none;
  }
  h1 { font-size: 1.6rem; letter-spacing: 2px; }
  #hud { display: flex; gap: 24px; font-size: 1rem; font-weight: 600; }
  #hud span b { color: #ffd166; }
  #wrap { position: relative; width: 100%; max-width: 640px; }
  canvas {
    width: 100%; aspect-ratio: 640 / 480; display: block;
    background: #0e1530; border: 2px solid #2d3b66; border-radius: 10px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: rgba(8, 12, 28, .78); border-radius: 10px; text-align: center; padding: 16px;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { font-size: 2rem; }
  #overlay p { opacity: .85; line-height: 1.6; }
  button {
    font: inherit; font-weight: 700; font-size: 1.1rem; cursor: pointer;
    padding: 10px 28px; border: none; border-radius: 999px;
    background: linear-gradient(135deg, #ff6b6b, #ffd166); color: #1a1a2e;
  }
  button:hover { filter: brightness(1.1); }
  .help { font-size: .85rem; opacity: .6; }
</style>
</head>
<body>
<h1>🧱 벽돌 깨기</h1>
<div id="hud">
  <span>점수 <b id="score">0</b></span>
  <span>최고 <b id="best">0</b></span>
  <span>레벨 <b id="level">1</b></span>
  <span>생명 <b id="lives">3</b></span>
</div>
<div id="wrap">
  <canvas id="game" width="640" height="480"></canvas>
  <div id="overlay">
    <h2 id="ovTitle">벽돌 깨기</h2>
    <p id="ovText">공을 튕겨 모든 벽돌을 깨세요!<br>아이템: <span style="color:#4dd0e1">W</span> 패들 확장 · <span style="color:#b388ff">M</span> 멀티볼 · <span style="color:#ff8a80">+</span> 생명</p>
    <button id="startBtn">시작하기</button>
  </div>
</div>
<p class="help">조작: 마우스 / 터치 / ← → 키 · 스페이스: 발사 · P: 일시정지</p>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const $ = id => document.getElementById(id);

const COLORS = ['#ff6b6b', '#ff9f43', '#ffd166', '#06d6a0', '#4dabf7', '#9775fa'];
const ROWS_BASE = 5, COLS = 10, BRICK_H = 20, BRICK_GAP = 6, TOP = 50;
const BRICK_W = (W - BRICK_GAP * (COLS + 1)) / COLS;

let paddle, balls, bricks, drops, particles;
let score = 0, lives = 3, level = 1, running = false, paused = false;
let best = 0;
try { best = +localStorage.getItem('brick-best') || 0; } catch (e) {}
$('best').textContent = best;

const keys = {};

function resetPaddle() {
  paddle = { w: 100, h: 12, x: W / 2 - 50, y: H - 30, speed: 8, wideTimer: 0 };
}

function newBall(stuck = true) {
  const speed = 4.5 + level * 0.4;
  return { x: paddle.x + paddle.w / 2, y: paddle.y - 8, r: 7, dx: speed * 0.6, dy: -speed * 0.8, speed, stuck };
}

function buildLevel() {
  bricks = [];
  const rows = Math.min(ROWS_BASE + level - 1, 9);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < COLS; c++) {
      // 레벨별 패턴
      if (level % 3 === 2 && (r + c) % 2 === 1 && r > 0) continue;
      if (level % 3 === 0 && Math.abs(c - (COLS - 1) / 2) < r * 0.6 - 1) continue;
      const hp = r < Math.floor(level / 2) ? 2 : 1;
      bricks.push({
        x: BRICK_GAP + c * (BRICK_W + BRICK_GAP),
        y: TOP + r * (BRICK_H + BRICK_GAP),
        w: BRICK_W, h: BRICK_H, hp, maxHp: hp,
        color: COLORS[r % COLORS.length],
      });
    }
  }
}

function startGame() {
  score = 0; lives = 3; level = 1;
  startLevel();
  running = true; paused = false;
  $('overlay').classList.add('hidden');
  updateHud();
}

function startLevel() {
  resetPaddle();
  balls = [newBall()];
  drops = []; particles = [];
  buildLevel();
}

function updateHud() {
  $('score').textContent = score;
  $('lives').textContent = lives;
  $('level').textContent = level;
  if (score > best) {
    best = score;
    $('best').textContent = best;
    try { localStorage.setItem('brick-best', best); } catch (e) {}
  }
}

function showOverlay(title, text, btn) {
  $('ovTitle').textContent = title;
  $('ovText').innerHTML = text;
  $('startBtn').textContent = btn;
  $('overlay').classList.remove('hidden');
}

function launch() {
  balls.forEach(b => b.stuck = false);
}

// ---------- 입력 ----------
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ') { e.preventDefault(); if (running) launch(); }
  if ((e.key === 'p' || e.key === 'P') && running) {
    paused = !paused;
    if (paused) showOverlay('일시정지', 'P 키를 눌러 계속하세요', '계속하기');
    else $('overlay').classList.add('hidden');
  }
});
document.addEventListener('keyup', e => keys[e.key] = false);

function pointerMove(clientX) {
  const rect = canvas.getBoundingClientRect();
  const x = (clientX - rect.left) * (W / rect.width);
  paddle && (paddle.x = Math.max(0, Math.min(W - paddle.w, x - paddle.w / 2)));
}
canvas.addEventListener('mousemove', e => pointerMove(e.clientX));
canvas.addEventListener('click', () => running && launch());
canvas.addEventListener('touchstart', e => { pointerMove(e.touches[0].clientX); if (running) launch(); e.preventDefault(); }, { passive: false });
canvas.addEventListener('touchmove', e => { pointerMove(e.touches[0].clientX); e.preventDefault(); }, { passive: false });

$('startBtn').addEventListener('click', () => {
  if (paused) { paused = false; $('overlay').classList.add('hidden'); return; }
  startGame();
});

// ---------- 게임 로직 ----------
function spawnParticles(x, y, color) {
  for (let i = 0; i < 10; i++) {
    particles.push({
      x, y, dx: (Math.random() - .5) * 6, dy: (Math.random() - .5) * 6,
      life: 30, color,
    });
  }
}

function maybeDrop(x, y) {
  if (Math.random() > 0.15) return;
  const types = ['W', 'W', 'M', 'M', '+'];
  const type = types[Math.floor(Math.random() * types.length)];
  drops.push({ x, y, type, dy: 2.5 });
}

function applyDrop(type) {
  if (type === 'W') { paddle.w = 160; paddle.wideTimer = 600; }
  if (type === 'M') {
    const extra = [];
    balls.forEach(b => {
      if (b.stuck) return;
      [-1, 1].forEach(s => {
        const ang = Math.atan2(b.dy, b.dx) + s * 0.4;
        extra.push({ ...b, dx: Math.cos(ang) * b.speed, dy: Math.sin(ang) * b.speed });
      });
    });
    balls.push(...extra.slice(0, 8));
  }
  if (type === '+') lives++;
  score += 50;
  updateHud();
}

function update() {
  // 패들 이동
  if (keys['ArrowLeft']) paddle.x -= paddle.speed;
  if (keys['ArrowRight']) paddle.x += paddle.speed;
  if (paddle.wideTimer > 0 && --paddle.wideTimer === 0) {
    const cx = paddle.x + paddle.w / 2;
    paddle.w = 100; paddle.x = cx - 50;
  }
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

  for (const b of balls) {
    if (b.stuck) { b.x = paddle.x + paddle.w / 2; b.y = paddle.y - b.r - 1; continue; }

    b.x += b.dx; b.y += b.dy;

    // 벽 충돌
    if (b.x - b.r < 0) { b.x = b.r; b.dx = Math.abs(b.dx); }
    if (b.x + b.r > W) { b.x = W - b.r; b.dx = -Math.abs(b.dx); }
    if (b.y - b.r < 0) { b.y = b.r; b.dy = Math.abs(b.dy); }

    // 패들 충돌 - 맞은 위치에 따라 각도 변경
    if (b.dy > 0 && b.y + b.r >= paddle.y && b.y + b.r <= paddle.y + paddle.h + 6 &&
        b.x >= paddle.x - b.r && b.x <= paddle.x + paddle.w + b.r) {
      const hit = (b.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
      const ang = Math.max(-1, Math.min(1, hit)) * (Math.PI / 3);
      b.dx = b.speed * Math.sin(ang);
      b.dy = -b.speed * Math.cos(ang);
      b.y = paddle.y - b.r;
    }

    // 벽돌 충돌
    for (const br of bricks) {
      if (br.hp <= 0) continue;
      const cx = Math.max(br.x, Math.min(b.x, br.x + br.w));
      const cy = Math.max(br.y, Math.min(b.y, br.y + br.h));
      const ddx = b.x - cx, ddy = b.y - cy;
      if (ddx * ddx + ddy * ddy > b.r * b.r) continue;

      // 반사 방향 결정
      const overlapX = Math.min(b.x + b.r - br.x, br.x + br.w - (b.x - b.r));
      const overlapY = Math.min(b.y + b.r - br.y, br.y + br.h - (b.y - b.r));
      if (overlapX < overlapY) b.dx = -b.dx; else b.dy = -b.dy;

      br.hp--;
      if (br.hp <= 0) {
        score += 10 * level;
        spawnParticles(br.x + br.w / 2, br.y + br.h / 2, br.color);
        maybeDrop(br.x + br.w / 2, br.y + br.h / 2);
      } else {
        score += 5;
      }
      updateHud();
      break;
    }
  }

  // 떨어진 공 제거
  balls = balls.filter(b => b.y - b.r < H);
  if (balls.length === 0) {
    lives--;
    updateHud();
    if (lives <= 0) {
      running = false;
      showOverlay('게임 오버', `최종 점수: <b>${score}</b><br>최고 점수: <b>${best}</b>`, '다시 하기');
      return;
    }
    resetPaddle();
    balls = [newBall()];
    drops = [];
  }

  // 아이템
  for (const d of drops) {
    d.y += d.dy;
    if (d.y + 10 >= paddle.y && d.y - 10 <= paddle.y + paddle.h &&
        d.x >= paddle.x && d.x <= paddle.x + paddle.w) {
      d.caught = true;
      applyDrop(d.type);
    }
  }
  drops = drops.filter(d => !d.caught && d.y < H + 20);

  // 파티클
  for (const p of particles) { p.x += p.dx; p.y += p.dy; p.dy += 0.15; p.life--; }
  particles = particles.filter(p => p.life > 0);

  // 레벨 클리어
  if (bricks.every(br => br.hp <= 0)) {
    level++;
    score += 100;
    updateHud();
    startLevel();
  }
}

// ---------- 그리기 ----------
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // 벽돌
  for (const br of bricks) {
    if (br.hp <= 0) continue;
    ctx.globalAlpha = br.hp < br.maxHp ? 0.55 : 1;
    ctx.fillStyle = br.color;
    roundRect(br.x, br.y, br.w, br.h, 4);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    ctx.fillRect(br.x + 3, br.y + 3, br.w - 6, 4);
    if (br.maxHp > 1 && br.hp > 1) {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      roundRect(br.x + 1, br.y + 1, br.w - 2, br.h - 2, 4); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  // 파티클
  for (const p of particles) {
    ctx.globalAlpha = p.life / 30;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  // 아이템
  const dropColors = { W: '#4dd0e1', M: '#b388ff', '+': '#ff8a80' };
  for (const d of drops) {
    ctx.fillStyle = dropColors[d.type];
    ctx.beginPath(); ctx.arc(d.x, d.y, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#0e1530';
    ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(d.type, d.x, d.y + 1);
  }

  // 패들
  const g = ctx.createLinearGradient(paddle.x, 0, paddle.x + paddle.w, 0);
  g.addColorStop(0, paddle.wideTimer > 0 ? '#4dd0e1' : '#ff6b6b');
  g.addColorStop(1, '#ffd166');
  ctx.fillStyle = g;
  roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
  ctx.fill();

  // 공
  for (const b of balls) {
    ctx.shadowColor = '#fff'; ctx.shadowBlur = 12;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  }

  if (running && balls.some(b => b.stuck)) {
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.font = '16px "Malgun Gothic", sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(`레벨 ${level} — 클릭 / 스페이스로 발사`, W / 2, H / 2 + 60);
  }
}

function loop() {
  if (running && !paused) update();
  if (paddle) draw();
  requestAnimationFrame(loop);
}

resetPaddle();
balls = [newBall()]; drops = []; particles = [];
buildLevel();
loop();
</script>
</body>
</html>
